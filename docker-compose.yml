version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventix-postgres
    environment:
      POSTGRES_DB: eventix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: eventix-redis
    ports:
      - "6379:6379"